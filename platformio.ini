; Uniden Connect - SDS200 remote for the Freenove ESP32-S3 3.5" display (FNK0104N)
;
; Board: ESP32-S3-WROOM-1 N8R8 (8 MB flash, 8 MB octal PSRAM)
; Build:  click the checkmark in the PlatformIO toolbar (or run `pio run`)
; Flash:  click the right-arrow in the PlatformIO toolbar (or run `pio run -t upload`)

; Your OTA (wireless update) password lives in secrets.ini (not uploaded to GitHub).
[platformio]
default_envs = fnk0104n
extra_configs = secrets.ini

[ota]
password =

[env:fnk0104n]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = arduino

; --- memory layout for the N8R8 module ---
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 8MB
board_upload.maximum_size = 8388608
board_build.partitions = default_8MB.csv

; Boot logo + animation built into the firmware (regenerate with tools/make_boot_assets.sh)
board_build.embed_files =
    data/boot_logo.jpg
    data/boot_anim.bin

monitor_speed = 115200
upload_speed = 921600
monitor_filters = esp32_exception_decoder

build_flags =
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    ; The FNK0104N uses the ESP32-S3 native USB port, so Serial goes over USB CDC.
    -DARDUINO_USB_CDC_ON_BOOT=1

lib_deps =
    lovyan03/LovyanGFX@1.1.16

; Upload over Wi-Fi: pick "env:fnk0104n_ota" in the PlatformIO toolbar, then Upload.
; The board must be on and on Wi-Fi; the password comes from secrets.ini.
[env:fnk0104n_ota]
extends = env:fnk0104n
upload_protocol = espota
upload_port = uniden-connect.local
upload_flags =
    --auth=${ota.password}

; ---------------------------------------------------------------------------
; M5Stack Tab5 (ESP32-P4, 5" 1280x720). Build, then install
; .pio/build/tab5/firmware.bin with bmorcelli's Launcher (SD card / WebUI).
; Needs the pioarduino platform (Arduino-ESP32 3.x).
[env:tab5]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.21/platform-espressif32.zip
framework = arduino
board = esp32-p4-evboard
board_build.mcu = esp32p4
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions_tab5.csv
board_build.embed_files =
    data/boot_logo.jpg
    data/boot_anim.bin
monitor_speed = 115200
upload_speed = 1500000
build_flags =
    -DBOARD_TAB5
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=2
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
lib_deps =
    m5stack/M5Unified@0.3.0
    m5stack/M5GFX@0.3.0
